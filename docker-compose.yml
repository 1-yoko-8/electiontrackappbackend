version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    env_file:
      - .env
    restart: always

    dns:
      - 8.8.8.8
      - 1.1.1.1

    command: >
      gunicorn -k uvicorn.workers.UvicornWorker
      app.main:app
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      --log-level info

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend